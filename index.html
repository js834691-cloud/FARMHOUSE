footer{background:#1d3a24;color:#dfe9dc;padding:36px 5vw 90px;text-align:center}footer h3{color:#fff}

<div class="gal">${S.gallery.map((g,i)=>`<figure><img src="${esc(g.src)}" alt="${esc(g.cap)}" data-lb="${i}" loading="lazy">${ed?`<input data-p="gallery.${i}.cap" value="${esc(g.cap)}" placeholder="Caption"><button class="x" data-a="dg" data-i="${i}">🗑 Remove</button>`:g.cap?`<figcaption>${esc(g.cap)}</figcaption>`:''}</figure>`).join('')}</div></section>
<section id="videos"><h2>${t('vdh')}</h2><br>${ed?`<div class="ed"><h3>🎬 Upload videos / वीडियो जोड़ें</h3><input type="file" id="vup" accept="video/mp4,video/webm" multiple><small>MP4 or WebM, max 20 MB each. / अधिकतम 20 MB</small> <span class="date" id="vst"></span></div>`:''}${S.videos.length?`<div class="grid" style="grid-template-columns:repeat(auto-fit,minmax(280px,1fr))">${S.videos.map((v,i)=>`<figure style="margin:0"><video controls preload="metadata" playsinline src="${esc(v.src)}" style="width:100%;border-radius:12px;background:#000"></video>${ed?`<input data-p="videos.${i}.cap" value="${esc(v.cap)}" placeholder="Caption"><button class="x" data-a="dv" data-i="${i}">🗑 Remove</button>`:v.cap?`<figcaption style="font-size:13px;color:var(--mut);padding:4px 2px">${esc(v.cap)}</figcaption>`:''}</figure>`).join('')}</div>`:`<div class="empty">${t('vem')}</div>`}</section>
<section id="youtube" class="band"><div><h2>${t('ytH')}</h2><p class="sub">${t('ytS')}</p>${ed?`<div class="ed"><h3>▶ YouTube links</h3>${P('yt.channel',S.yt.channel)}<small>↑ Channel link (https://youtube.com/...)</small><br><br>${S.yt.items.map((y,i)=>`<div class="r2">${P(`yt.items.${i}.title`,y.title)}${P(`yt.items.${i}.url`,y.url)}</div><button class="x" data-a="dy" data-i="${i}">🗑 Remove</button>`).join('')}<button class="btn s" data-a="ay">+ Add video (title + link)</button></div>`:''}${!ed&&S.yt.channel?`<p><a class="btn" style="background:#d00" href="${esc(safe(S.yt.channel))}" target="_blank" rel="noopener">${t('ytC')}</a></p>`:''}${S.yt.items.length?`<div class="grid">${S.yt.items.map(y=>`<a class="card" href="${esc(safe(y.url))}" target="_blank" rel="noopener" style="text-decoration:none;color:inherit"><div class="e" style="color:#d00;font-size:38px">▶</div><h3>${esc(y.title||'Video')}</h3><p>${t('ytW')}</p></a>`).join('')}</div>`:ed?'':`<div class="empty">${t('ytE')}</div>`}</div></section>
<section id="seasons" class="band"><div><h2>${t('sh')}</h2><br><div class="grid">${cards(seas)}</div></div></section>
<section id="visit"><div class="split" style="align-items:start"><div><h2>${t('hh')}</h2><br><div class="hrs">${S.hours.map((h,i)=>ed?`<div style="display:block"><div class="r2" style="border:0">${P(`hours.${i}.d.en`,h.d.en)}${P(`hours.${i}.d.hi`,h.d.hi)}</div>${P(`hours.${i}.t`,h.t)}<button class="x" data-a="dh" data-i="${i}">🗑 Remove</button></div>`:`<div><span>${esc(L(h.d))}</span><b>${esc(h.t)}</b></div>`).join('')}</div>${ed?'<button class="btn s" data-a="ah">+ Add row</button>':''}
<br><br><h3>${lang=='hi'?'पता व संपर्क':'Address & contact'}</h3><p>${ed?P('contact.addr.en',S.contact.addr.en)+P('contact.addr.hi',S.contact.addr.hi)+P('contact.phone',S.contact.phone)+P('contact.map',S.contact.map)+'<small>↑ Address (EN, हिं), phone, Google Maps link</small>':esc(L(S.contact.addr))}</p>
${!ed&&S.contact.map?`<a class="btn" href="${esc(S.contact.map)}" target="_blank" rel="noopener">${t('mb')}</a> `:''}${!ed&&S.contact.phone?`<a class="btn s" href="tel:${esc(S.contact.phone.replace(/[^+\d]/g,''))}">📞 ${esc(S.contact.phone)}</a>`:''}</div>
<div><h2>${t('rh')}</h2><br><ul class="rules">${S.rules.map((r,i)=>ed?`<li style="padding-left:0">${P(`rules.${i}.en`,r.en)}${P(`rules.${i}.hi`,r.hi)}<button class="x" data-a="dr" data-i="${i}">🗑 Remove</button></li>`:`<li>${esc(L(r))}</li>`).join('')}</ul>${ed?'<br><button class="btn s" data-a="ar">+ Add rule</button>':''}</div></div></section>
<footer><h3>🌿 ${t('brand')}</h3><p>${t('fn')}</p><p><a href="#" id="adm" style="color:#9db39d;font-size:12px">Admin</a></p></footer>
${false?`<div id="bar"><button class="btn ${ed?'':'s'}" data-a="em">${ed?'✓ Done editing':'✏️ Edit site'}</button><button class="btn" data-a="pub" ${dirty?'':'disabled style="opacity:.5"'}>Publish changes</button><span id="pst">${dirty?'Unsaved changes':''}</span></div>`:''}`;
scrollTo(0,y)}
function setP(p,v){const k=p.split('.');let o=S;for(let i=0;i<k.length-1;i++)o=o[k[i]];o[k[k.length-1]]=v;mark()}
function mark(){if(!dirty){dirty=true;const b=document.querySelector('[data-a=pub]');if(b){b.disabled=false;b.style.opacity=1}const s=$('#pst');if(s)s.textContent='Unsaved changes'}}
async function up(f){const n=Date.now()+'-'+f.name.replace(/[^\w.-]/g,'_');const r=await sb.storage.from('media').upload(n,f,{contentType:f.type});if(r.error)throw r.error;return sb.storage.from('media').getPublicUrl(n).data.publicUrl}
document.addEventListener('input',e=>{const p=e.target.dataset&&e.target.dataset.p;if(p)setP(p,e.target.value);const i=e.target.id;if(i=='dty')D.type=e.target.value;if(i=='ddt')D.date=e.target.value;if(i=='dti')D.title=e.target.value;if(i=='dtx')D.text=e.target.value});
document.addEventListener('change',async e=>{const i=e.target.id;try{if(i=='dph'&&e.target.files[0]){D.img=await up(e.target.files[0]);render()}
if(i=='gup'){const st=$('#gst');for(const f of e.target.files){st.textContent=' Uploading…';S.gallery.unshift({src:await up(f),cap:''})}mark();render()}
if(i=='vup'){const st=$('#vst');for(const f of e.target.files){st.textContent=' Uploading…';S.videos.unshift({src:await up(f),cap:''})}mark();render()}}catch(x){alert('Upload failed: '+(x.message||x))}});
document.addEventListener('click',async e=>{const d=e.target.dataset||{};
if(e.target.id=='adm'){e.preventDefault();adminLogin()}else if(e.target.id=='lg'){lang=lang=='hi'?'en':'hi';try{localStorage.setItem('lang',lang)}catch(x){}render()}
else if(d.t){filter=d.t;render()}
else if(d.lb!=null){const o=document.createElement('div');o.className='lb';o.innerHTML=`<img src="${esc(S.gallery[d.lb].src)}">`;o.onclick=()=>o.remove();document.body.appendChild(o)}
else if(d.a=='em'){ed=!ed;render()}
else if(d.a=='dp'){if(confirm('Delete?')){S.posts.splice(+d.i,1);mark();render()}}
else if(d.a=='dg'){S.gallery.splice(+d.i,1);mark();render()}
else if(d.a=='dv'){S.videos.splice(+d.i,1);mark();render()}
else if(d.a=='dy'){S.yt.items.splice(+d.i,1);mark();render()}else if(d.a=='ay'){S.yt.items.push({title:'',url:''});mark();render()}
else if(d.a=='dh'){S.hours.splice(+d.i,1);mark();render()}else if(d.a=='ah'){S.hours.push({d:{en:'',hi:''},t:''});mark();render()}
else if(d.a=='dr'){S.rules.splice(+d.i,1);mark();render()}else if(d.a=='ar'){S.rules.push({en:'',hi:''});mark();render()}
else if(e.target.id=='dadd'){if(!D.title.trim()&&!D.text.trim()){alert('Write a title or note first');return}S.posts.unshift({type:D.type,date:D.date,title:D.title.trim()||'Farm update',text:D.text.trim(),img:D.img});D={...D,title:'',text:'',img:''};mark();render()}
else if(d.a=='pub'&&dirty){const s=$('#pst');s.textContent='Publishing…';try{const r=await sb.from('site').upsert({id:1,data:S});if(r.error)throw r.error;dirty=false;render();alert('Published. Everyone can now see your changes.')}catch(x){s.textContent=x.code=='conflict'?'Someone else published — reloading':'Could not publish: '+(x.message||x.code)}}});
render();
const SUPA_URL='PASTE_SUPABASE_URL',SUPA_KEY='PASTE_SUPABASE_ANON_KEY';let sb=null;
async function adminLogin(){if(!sb){alert('Backend not configured yet (see README)');return}const email=prompt('Admin email');if(!email)return;const password=prompt('Password');if(!password)return;const r=await sb.auth.signInWithPassword({email,password});if(r.error){alert(r.error.message);return}can=true;render()}
(async()=>{if(!window.supabase||SUPA_URL.startsWith('PASTE'))return;sb=supabase.createClient(SUPA_URL,SUPA_KEY);try{const r=await sb.from('site').select('data').eq('id',1).maybeSingle();if(r.data&&r.data.data){S=Object.assign(S,r.data.data);S.videos=S.videos||[];S.yt=S.yt||{channel:'',items:[]};render()}const s=await sb.auth.getSession();if(s.data.session){can=true;render()}}catch(x){console.error(x)}})();
</script></body></html>
